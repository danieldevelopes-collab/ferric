[package]
name = "ferric"
version = "0.1.0"
edition = "2021"
description = "ferric — a small word processor with a Rust engine and a Tauri web UI."
license = "MIT"
authors = ["Daniel Bracher"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ferric-core = { path = "../crates/ferric-core" }

[[bin]]
name = "ferric"
path = "src/main.rs"
