[package]
name = "ferric-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The document engine behind ferric: a formatted-text model and conversions to/from Markdown, RTF, .docx, plain text and JSON."
authors = ["Daniel Bracher"]

[lib]
name = "ferric_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false }
docx-rs = "0.4"
printpdf = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
